name: Data Preprocessing Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'online_shoppers_intention.csv'
      - 'preprocessing/automate_Dhaffa-Zikrullah-Ramadhan.py'
  workflow_dispatch:

jobs:
  preprocess-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn numpy

      - name: Run Automation Script
        run: |
          cd preprocessing
          python automate_Dhaffa-Zikrullah-Ramadhan.py

      - name: Commit and Push Processed Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/dataset_processed/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-process dataset via CI" && git push)